services:
  branch-watcher:
    build:
      # Paths are relative to the compose project directory, which start.sh
      # pins to the repo root — so the context is the root (Dockerfile can
      # COPY app/) and the Dockerfile lives under docker/.
      context: .
      dockerfile: docker/Dockerfile
    image: branch-watcher:latest
    container_name: branch-watcher

    # Host networking so:
    #   * arp-scan can actually see the LAN, and
    #   * the web UI is reachable at the host's own IP:BW_PORT.
    # With host mode there is no separate port mapping (the container shares
    # the host's network stack directly).
    network_mode: host

    # Capabilities the optional firewall/scan feature needs.
    cap_add:
      - NET_ADMIN   # ufw rule changes
      - NET_RAW     # arp-scan raw sockets

    # Load user config (.env at the project root). Values below override the
    # bits that differ inside the container. Path is relative to the compose
    # project directory, which start.sh pins to the repo root.
    env_file:
      - .env

    environment:
      # The app runs as the non-root `app` user, which has passwordless sudo
      # for ONLY arp-scan/ufw (see Dockerfile). `-n` fails fast instead of
      # hanging on a password prompt. SUDO_CMD (default "sudo -n") is used by
      # firewall.py for ufw.
      ARP_SCAN_CMD: "sudo -n arp-scan --localnet"
      # Always run the web server inside the container.
      BW_SERVE: "true"
      # The watched repo is mounted at /repo (see volumes).
      BW_REPO: "/repo"
      # Persist logs to the named volume below.
      BW_LOG_FILE: "/app/logs/branch_watcher.log"

    volumes:
      # The git repository you want to watch: BW_REPO from .env is the path on
      # the HOST and is mounted to /repo inside the container (the BW_REPO env
      # above points the app at /repo). Read-only is enough unless --fetch.
      - ${BW_REPO:-./repo}:/repo:ro
      # Persisted, rotating log files. A named volume (not a host bind mount)
      # so the non-root `app` user keeps ownership and can write to it.
      - branch-watcher-logs:/app/logs

    restart: unless-stopped

volumes:
  branch-watcher-logs:
